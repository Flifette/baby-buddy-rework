services:
  babybuddy:
    image: lscr.io/linuxserver/babybuddy:v2.9.2-ls237@sha256:8f86cc0cdf1c8b251709128e4e4f5266ec3ad73314367726d893b8c7594f2e88
    profiles:
      - full
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - babybuddy_data:/config
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: baby-buddy-dashboard-rework:local
    environment:
      - BABY_BUDDY_URL=${BABY_BUDDY_URL:-http://babybuddy:8000}
      - BABY_BUDDY_API_KEY=${BABY_BUDDY_API_KEY}
      - REFRESH_INTERVAL=${REFRESH_INTERVAL:-30}
      - UNIT_SYSTEM=${UNIT_SYSTEM:-metric}
      - DEMO_MODE=${DEMO_MODE:-false}
      - TZ=${TZ:-Europe/Paris}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:?Set DASHBOARD_USERNAME in .env}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?Set a DASHBOARD_PASSWORD of at least 16 characters in .env}
    ports:
      - "8099:8099"
    volumes:
      - dashboard_data:/data
    restart: unless-stopped

volumes:
  babybuddy_data:
  dashboard_data:
